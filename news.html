<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>News & Updates | ThermoH2</title>
    <meta name="description" content="Alle News und Updates zum ThermoH2-Projekt." />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
  </head>

  <body class="page-light page-news">
    <a class="skip" href="#main">Zum Inhalt</a>

    <header class="page-hero" id="top">
      <div class="container page-hero-inner">
        <div>
          <p class="kicker">News & Updates</p>
          <h1>Alle Einträge</h1>
          <p class="lead">Neuigkeiten aus Labor, Reaktorentwicklung, Projektaktionen und Veranstaltungen – kompakt an einem Ort.</p>
          <div class="page-nav">
            <a class="button ghost" href="index.html">Startseite</a>
            <a class="button ghost" href="bert1.html">BERT 1</a>
            <a class="button ghost" href="bert2.html">BERT 2</a>
          </div>
        </div>
        <div class="page-hero-media">
          <img src="assets/jufo.jpg" alt="ThermoH2 bei Jugend forscht" class="zoomable" />
        </div>
      </div>
    </header>

    <main id="main">
      <section class="section">
        <div class="container">
          <div class="news-list-grid">
            <button class="news-list-card" type="button" data-news-open="bruessel">
              <img src="assets/Brüssel.JPG" alt="ThermoH2 beim Ausflug nach Brüssel" data-fallback-image>
              <span class="news-list-body">
                <span class="news-label">Neuestes Update</span>
                <strong>Ausflug nach Brüssel</strong>
                <span>Projektvorstellung, Austausch und europäische Perspektiven.</span>
              </span>
            </button>

            <button class="news-list-card" type="button" data-news-open="tauschdoch">
              <img src="assets/tausch_doch_logo.png" alt="Logo des Start-ups Tausch doch" class="news-list-logo" data-fallback-image>
              <span class="news-list-body">
                <span class="news-label">Start-up</span>
                <strong>Tausch doch</strong>
                <span>Eine nachhaltige Onlineplattform für Tauschen statt Neukaufen.</span>
              </span>
            </button>

            <button class="news-list-card" type="button" data-news-open="bert2">
              <img src="assets/Bert2.jpg" alt="BERT 2" data-fallback-image>
              <span class="news-list-body">
                <span class="news-label">Entwicklung</span>
                <strong>BERT 2</strong>
                <span>Die Entwicklung führt vom Batch- zum Durchlaufreaktor.</span>
              </span>
            </button>

            <button class="news-list-card" type="button" data-news-open="laborumzug">
              <img src="assets/Labor.png" alt="Laborbereich von ThermoH2" data-fallback-image>
              <span class="news-list-body">
                <span class="news-label">Ältester Eintrag</span>
                <strong>Laborumzug</strong>
                <span>Neuer Platz für Aufbau, Messstrecke und Dokumentation.</span>
              </span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <div class="footer-brand-block">
          <div class="footer-brand">ThermoH2</div>
          <div class="footer-sub">Jugend-forscht-Projekt</div>
          <div class="footer-counter"><span id="visitorCount">---</span></div>
        </div>

        <div class="footer-links">
          <a href="index.html">Startseite</a>
          <a href="news.html">News</a>
          <a href="bert1.html">BERT 1</a>
          <a href="bert2.html">BERT 2</a>
          <a class="social-link" href="https://www.instagram.com/thermoh2_bert?igsh=MXZ2dWZjcm9sb3poZw==" target="_blank" rel="noopener noreferrer" aria-label="ThermoH2 auf Instagram öffnen">
            <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="3" y="3" width="18" height="18" rx="5"></rect>
              <circle cx="12" cy="12" r="4"></circle>
              <circle cx="17.5" cy="6.5" r="1.1"></circle>
            </svg>
            <span class="sr-only">Instagram</span>
          </a>
        </div>
      </div>
      <div class="container footer-bottom">
        <div>© <span id="year"></span> ThermoH2</div>
      </div>
    </footer>

    <dialog class="modal news-modal" id="newsModal" aria-label="News Beitrag">
      <div class="modal-head">
        <div>
          <div class="modal-sub" id="newsModalMeta">News</div>
          <div class="modal-title" id="newsModalTitle">Beitrag</div>
        </div>
        <button class="icon-btn" type="button" id="newsModalClose" aria-label="Schließen">✕</button>
      </div>
      <div class="modal-body">
        <p id="newsModalIntro"></p>
        <div class="news-modal-gallery" id="newsModalGallery"></div>
        <div id="newsModalBody"></div>
      </div>
    </dialog>

    <div id="imageModal" class="img-modal">
      <span class="img-close">&times;</span>
      <img class="img-modal-content" id="imgModalContent">
    </div>

    <script src="script.js"></script>
  </body>
</html>
